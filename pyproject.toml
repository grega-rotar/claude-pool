[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pool"
version = "0.4.0"
description = "Drop-in wrapper for the Claude Code CLI that runs each call on the account with the most usage left"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"

[project.scripts]
claude-pool = "claude_pool:main"

[tool.setuptools]
py-modules = ["claude_pool"]
